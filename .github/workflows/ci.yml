name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu / GCC / C++20
            os: ubuntu-latest
            cmake_options: -DCMAKE_CXX_COMPILER=g++
            standard: 20
          - name: Ubuntu / Clang / C++20
            os: ubuntu-latest
            cmake_options: -DCMAKE_CXX_COMPILER=clang++
            standard: 20
          - name: Ubuntu / GCC / C++23
            os: ubuntu-latest
            cmake_options: -DCMAKE_CXX_COMPILER=g++
            standard: 23
          - name: macOS / Apple Clang / C++20
            os: macos-latest
            cmake_options: -DCMAKE_CXX_COMPILER=clang++
            standard: 20
          - name: Windows / MSVC / C++20
            os: windows-latest
            cmake_options: -G "Visual Studio 17 2022" -A x64 -DTEMPO_BUILD_DIAGNOSTICS=OFF
            standard: 20

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_STANDARD=${{ matrix.standard }}
          ${{ matrix.cmake_options }}

      - name: Build tests and examples
        run: cmake --build build --config Release --parallel

      - name: Run CTest suite
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Install tempo
        run: cmake --install build --config Release --prefix install

      - name: Build and run an installed-package consumer
        run: >
          cmake -S tests/consumer -B consumer-build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH=${{ github.workspace }}/install

      - name: Verify installed-package consumer
        run: cmake --build consumer-build --config Release --parallel

      - name: Run installed-package consumer
        run: ctest --test-dir consumer-build -C Release --output-on-failure

  configuration:
    name: Ubuntu / GCC / ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: recursion counted
            options: -DTEMPO_COUNT_RECURSION=1
          - name: per-call printing
            options: -DTEMPO_PRINT_ENABLED=1
          - name: no worst-call ranking
            options: -DTEMPO_WORST_CALLS=0

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=g++
          ${{ matrix.options }}

      - name: Build and run tests and examples
        run: cmake --build build --parallel && ctest --test-dir build --output-on-failure

  disabled-instrumentation:
    name: Ubuntu / GCC / instrumentation disabled
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure examples without instrumentation
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=g++
          -DTEMPO_BUILD_TESTS=OFF
          -DTEMPO_ENABLED=0

      - name: Build examples
        run: cmake --build build --parallel

  sanitizers:
    name: Ubuntu / Clang / ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: AddressSanitizer + UBSan
            flags: -fsanitize=address,undefined -fno-omit-frame-pointer
          - name: ThreadSanitizer
            flags: -fsanitize=thread

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_CXX_FLAGS="${{ matrix.flags }}"
          -DCMAKE_EXE_LINKER_FLAGS="${{ matrix.flags }}"

      - name: Build and run default configuration
        env:
          ASAN_OPTIONS: ${{ matrix.name == 'AddressSanitizer + UBSan' && 'detect_leaks=0:abort_on_error=1' || '' }}
          UBSAN_OPTIONS: ${{ matrix.name == 'AddressSanitizer + UBSan' && 'print_stacktrace=1:halt_on_error=1' || '' }}
          TSAN_OPTIONS: ${{ matrix.name == 'ThreadSanitizer' && 'halt_on_error=1' || '' }}
        run: cmake --build build --parallel && ctest --test-dir build --output-on-failure

      - name: Configure recursion-counted suite
        run: >
          cmake -S . -B recursion-build
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_CXX_FLAGS="${{ matrix.flags }}"
          -DCMAKE_EXE_LINKER_FLAGS="${{ matrix.flags }}"
          -DTEMPO_BUILD_EXAMPLES=OFF
          -DTEMPO_COUNT_RECURSION=1

      - name: Build and run recursion-counted suite
        env:
          ASAN_OPTIONS: ${{ matrix.name == 'AddressSanitizer + UBSan' && 'detect_leaks=0:abort_on_error=1' || '' }}
          UBSAN_OPTIONS: ${{ matrix.name == 'AddressSanitizer + UBSan' && 'print_stacktrace=1:halt_on_error=1' || '' }}
          TSAN_OPTIONS: ${{ matrix.name == 'ThreadSanitizer' && 'halt_on_error=1' || '' }}
        run: cmake --build recursion-build --parallel && ctest --test-dir recursion-build --output-on-failure
